<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <style>
    @font-face { font-family:'IBM Plex Sans'; font-style:normal; font-weight:400; src:local('IBM Plex Sans'); }
    @font-face { font-family:'IBM Plex Sans'; font-style:normal; font-weight:500; src:local('IBM Plex Sans'); }
    @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:500; src:local('JetBrains Mono'); }
    @font-face { font-family:'Newsreader'; font-style:italic; font-weight:400; src:local('Newsreader'); }
    @font-face { font-family:'Newsreader'; font-style:normal; font-weight:400; src:local('Newsreader'); }
  </style>
  <defs>
    <clipPath id="portrait"><rect x="880" y="140" width="240" height="240"/></clipPath>
  </defs>

  <!-- Quick Look pads to a square; everything below 630 is cropped away. -->
  <rect width="1200" height="1200" fill="#ffffff"/>
  <rect width="1200" height="630" fill="#f6f4ec"/>

  <!-- Plate border -->
  <rect x="24.5" y="24.5" width="1151" height="581" fill="none" stroke="#d9d7c8"/>

  <!-- Header rule: label, hairline, trace, URL -->
  <text x="72" y="93" font-family="'JetBrains Mono'" font-weight="500" font-size="14" letter-spacing="1.7" fill="#7a5c2e">GDA<tspan fill="#5c6152"> · PORTFOLIO</tspan></text>
  <line x1="262" y1="88" x2="748" y2="88" stroke="#d9d7c8"/>
  <line x1="772" y1="88" x2="862" y2="88" stroke="#4b5320" stroke-width="1.5"/><line x1="862" y1="88" x2="892" y2="88" stroke="#8a9268" stroke-width="1.25" stroke-dasharray="3 3"/><circle cx="772" cy="88" r="4" fill="#4b5320"/><circle cx="802" cy="88" r="4" fill="#4b5320"/><circle cx="832" cy="88" r="4" fill="#4b5320"/><rect x="858" y="84" width="8" height="8" transform="rotate(45 862 88)" fill="#a8834a"/><circle cx="892" cy="88" r="3.5" fill="#f6f4ec" stroke="#5c6152" stroke-width="1.25"/>
  <text x="1128" y="93" text-anchor="end" font-family="'JetBrains Mono'" font-weight="500" font-size="14" letter-spacing="1.7" fill="#5c6152">GARTHZX.GITHUB.IO</text>

  <!-- Name -->
  <text x="68" y="236" font-family="'Newsreader'" font-size="118" letter-spacing="-2.9" fill="#2c3119">Garth Dustin</text>
  <text x="68" y="346" font-family="'Newsreader'" font-style="italic" font-size="118" letter-spacing="-2.9" fill="#4b5320">Ayang-ang</text>

  <!-- Role (the focus is in the facts strip below) -->
  <text x="72" y="420" font-family="'Newsreader'" font-style="italic" font-size="32" fill="#5c6152">Full-Stack Software Engineer</text>

  <!-- Portrait, matted and captioned like the hero figure -->
  <rect x="872.5" y="132.5" width="255" height="255" fill="#fcfbf6" stroke="#d9d7c8"/>
  <image href="data:image/jpeg;base64," x="880" y="140" width="240" height="240"
         preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/>
  <text x="872" y="418" font-family="'JetBrains Mono'" font-weight="500" font-size="12" letter-spacing="1.4" fill="#5c6152">TUGUEGARAO CITY</text>
  <text x="1128" y="418" text-anchor="end" font-family="'JetBrains Mono'" font-weight="500" font-size="12" letter-spacing="1.4" fill="#5c6152">PH</text>

  <!-- Facts -->
  <line x1="72" y1="474" x2="1128" y2="474" stroke="#1f2218"/>
  <text x="72" y="522" font-family="'JetBrains Mono'" font-weight="500" font-size="14" letter-spacing="1.7" fill="#7a5c2e">CURRENTLY</text><text x="72" y="558" font-family="'IBM Plex Sans'" font-size="23" fill="#1f2218">Dentalflo AI</text><text x="424" y="522" font-family="'JetBrains Mono'" font-weight="500" font-size="14" letter-spacing="1.7" fill="#7a5c2e">FOCUS</text><text x="424" y="558" font-family="'IBM Plex Sans'" font-size="23" fill="#1f2218">Backend systems &amp; automation</text><text x="776" y="522" font-family="'JetBrains Mono'" font-weight="500" font-size="14" letter-spacing="1.7" fill="#7a5c2e">STACK</text><text x="776" y="558" font-family="'IBM Plex Sans'" font-size="23" fill="#1f2218">TypeScript · Hono · PostgreSQL</text>
  <line x1="72" y1="586" x2="1128" y2="586" stroke="#d9d7c8"/>
</svg>
