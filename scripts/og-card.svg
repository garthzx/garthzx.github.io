<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <style>
    @font-face { font-family:'Poppins'; font-weight:400; src:local('Poppins'); }
    @font-face { font-family:'Poppins'; font-weight:600; src:local('Poppins'); }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#747fe0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#747fe0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#747fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="96%" r="46%">
      <stop offset="0%" stop-color="#92eac0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#92eac0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="avatar"><circle cx="1012" cy="212" r="92"/></clipPath>
  </defs>

  <!-- Quick Look pads to a square; everything below 630 is cropped away. -->
  <rect width="1200" height="1200" fill="#ffffff"/>

  <rect width="1200" height="630" fill="#f8f8ff"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Avatar, ringed the way the site header rings it -->
  <circle cx="1012" cy="212" r="102" fill="#747fe0" fill-opacity="0.15"/>
  <image href="data:image/jpeg;base64," x="920" y="120" width="184" height="184"
         preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar)"/>
  <circle cx="1012" cy="212" r="92" fill="none" stroke="#747fe0" stroke-width="2.5"/>

  <!-- Wordmark -->
  <text x="90" y="212" font-family="JetBrains Mono" font-size="72" font-weight="800"
        fill="#747fe0" letter-spacing="2">&gt; Garth Dustin</text>

  <line x1="90" y1="258" x2="700" y2="258" stroke="#e6e8f0" stroke-width="2"/>

  <!-- Role -->
  <text x="90" y="312" font-family="Poppins" font-size="38" font-weight="600" fill="#525f7f">
    Full-Stack Software Engineer
  </text>
  <text x="90" y="358" font-family="Poppins" font-size="27" font-weight="400" fill="#7a86a3">
    Backend Systems &amp; Business Automation
  </text>

  <!-- Stack -->
  <rect x="90.0" y="404" width="158.0" height="46" rx="10" fill="#ffffff" stroke="#92eac0" stroke-width="1.5"/><text x="169.0" y="433" text-anchor="middle" font-family="Poppins" font-size="22" fill="#7a86a3">TypeScript</text><rect x="260.0" y="404" width="121.4" height="46" rx="10" fill="#ffffff" stroke="#92eac0" stroke-width="1.5"/><text x="320.7" y="433" text-anchor="middle" font-family="Poppins" font-size="22" fill="#7a86a3">Node.js</text><rect x="393.4" y="404" width="158.0" height="46" rx="10" fill="#ffffff" stroke="#92eac0" stroke-width="1.5"/><text x="472.4" y="433" text-anchor="middle" font-family="Poppins" font-size="22" fill="#7a86a3">PostgreSQL</text><rect x="563.4" y="404" width="121.4" height="46" rx="10" fill="#ffffff" stroke="#92eac0" stroke-width="1.5"/><text x="624.1" y="433" text-anchor="middle" font-family="Poppins" font-size="22" fill="#7a86a3">Inngest</text><rect x="696.8" y="404" width="109.2" height="46" rx="10" fill="#ffffff" stroke="#92eac0" stroke-width="1.5"/><text x="751.4" y="433" text-anchor="middle" font-family="Poppins" font-size="22" fill="#7a86a3">Stripe</text><rect x="818.0" y="404" width="145.8" height="46" rx="10" fill="#ffffff" stroke="#92eac0" stroke-width="1.5"/><text x="890.9" y="433" text-anchor="middle" font-family="Poppins" font-size="22" fill="#7a86a3">SvelteKit</text>

  <!-- Footer -->
  <line x1="90" y1="508" x2="1110" y2="508" stroke="#e6e8f0" stroke-width="2"/>
  <text x="90" y="556" font-family="Poppins" font-size="25" font-weight="400" fill="#9aa3bb">
    Currently at <tspan fill="#747fe0" font-weight="600">Dentalflo AI</tspan>
    <tspan fill="#9aa3bb"> &#183; Mandaluyong City, Philippines</tspan>
  </text>
</svg>
