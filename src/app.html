<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f6f4ec" />
		<!-- Generated by scripts/build-icons.py. Browsers that read SVG icons take the
		     second link; the .ico covers the rest. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>

		<!--
			Runs before first paint so nothing flashes:
			- theme: ?theme= wins, then the visitor's saved choice, else light;
			- motion: animations only switch on when the visitor has not asked
			  for reduced motion (and without JS this never runs, so content
			  is never left hidden);
			- intro: the loading curtain plays once per browser session, and
			  only on the home page.
		-->
		<script>
			(function () {
				var d = document.documentElement;
				var q = new URLSearchParams(location.search);
				var t = q.get('theme');
				if (t !== 'dark' && t !== 'light') {
					try {
						t = localStorage.getItem('gda-theme');
					} catch (e) {}
				}
				d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
				if (t === 'dark') {
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1d14');
				}

				var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
				if (reduce || q.get('motion') === 'off') return;
				d.setAttribute('data-motion', 'on');

				if (/^\/(index\.html)?$/.test(location.pathname) && q.get('intro') !== 'off') {
					try {
						if (!sessionStorage.getItem('gda-intro')) {
							sessionStorage.setItem('gda-intro', '1');
							d.setAttribute('data-intro', 'run');
						}
					} catch (e) {}
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
